[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "multipart-vault"
version = "0.1.0"
requires-python = ">=3.11"
description = "Threshold-backed multipart form receiver fixture"
license = { text = "MIT" }

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
